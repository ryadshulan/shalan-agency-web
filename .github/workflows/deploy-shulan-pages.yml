name: Deploy Shulan Management to GitHub Pages

# Temporarily manual while repository Pages enablement is unavailable.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: shulan-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Prepare website files
        run: |
          mkdir -p _site
          cp public/shulan-management.html _site/index.html
          cp public/shulan-management.html _site/shulan-management.html
          touch _site/.nojekyll
      - name: Activate GitHub Pages if necessary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          response=$(curl --silent --show-error -o /tmp/pages-response.json -w '%{http_code}' \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d '{"build_type":"workflow"}' \
            "https://api.github.com/repos/${{ github.repository }}/pages")
          echo "Pages activation response: $response"
          if [ "$response" != "201" ] && [ "$response" != "409" ] && [ "$response" != "422" ]; then
            cat /tmp/pages-response.json
            exit 1
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
